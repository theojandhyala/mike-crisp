<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 630" width="420" height="630" role="img" aria-label="Book cover: What Can't Be Unseen by Michael Crisp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="0.55" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#e7a24d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e7a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b86c"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </linearGradient>
  </defs>

  <rect width="420" height="630" fill="url(#bg)"/>
  <rect width="420" height="630" fill="url(#glow)"/>

  <!-- thin frame -->
  <rect x="18" y="18" width="384" height="594" fill="none" stroke="#9aa3b2" stroke-opacity="0.18" stroke-width="1"/>

  <!-- series line -->
  <text x="210" y="74" text-anchor="middle" fill="#9aa3b2" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" letter-spacing="4.5">A JAMES HARLAND THRILLER</text>

  <!-- eye / ECG motif -->
  <g transform="translate(210 250)">
    <!-- eye outline -->
    <path d="M -118 0 Q 0 -82 118 0 Q 0 82 -118 0 Z" fill="none" stroke="#5bc0be" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M -118 0 Q 0 82 118 0" fill="none" stroke="#5bc0be" stroke-opacity="0.18" stroke-width="6"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#amber)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="#f0b86c"/>
    <circle cx="-4" cy="-5" r="3" fill="#fff" fill-opacity="0.85"/>
    <!-- ECG line cutting across the gaze -->
    <path d="M -150 0 L -78 0 L -64 0 L -52 -26 L -38 30 L -24 0 L 24 0 L 38 -30 L 52 26 L 64 0 L 78 0 L 150 0"
          fill="none" stroke="url(#amber)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f4f1ea" text-anchor="middle">
    <text x="210" y="408" font-size="52" font-weight="700" letter-spacing="1">WHAT</text>
    <text x="210" y="462" font-size="52" font-weight="700" letter-spacing="1">CAN'T BE</text>
    <text x="210" y="516" font-size="52" font-weight="700" letter-spacing="1">UNSEEN</text>
  </g>

  <!-- divider -->
  <line x1="160" y1="548" x2="260" y2="548" stroke="url(#amber)" stroke-width="2"/>

  <!-- author -->
  <text x="210" y="582" text-anchor="middle" fill="#cfd5e1" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="5">MICHAEL CRISP</text>
</svg>
